<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>空格之境 — 宋代合成棋盘</title>
<style>
/* ===== CSS 变量 ===== */
:root {
  --paper: #f5efe0;
  --ink: #3d3226;
  --ink-light: #6b5d4f;
  --ink-mid: #8b7b68;
  --gold: #b8860b;
  --gold-light: #d4a843;
  --red: #c43a31;
  --red-dark: #9b1b1b;
  --wood: #6b4f3c;
  --shadow-sm: 0 1px 4px rgba(0,0,0,0.06);
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
  --shadow-lg: 0 4px 24px rgba(0,0,0,0.12);
  --radius: 6px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

/* ===== 宋代山水庭园背景 ===== */
body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  font-family: 'PingFang SC', 'Noto Serif SC', 'STSong', 'SimSun', 'Microsoft YaHei', serif;
  user-select: none; -webkit-user-select: none;
  padding: 16px;
  color: var(--ink);
  background-color: #c8d8e0;
  background-image:
    radial-gradient(ellipse 80% 18% at 20% 22%, rgba(140,170,190,0.7) 0%, transparent 70%),
    radial-gradient(ellipse 60% 14% at 60% 24%, rgba(150,180,195,0.65) 0%, transparent 70%),
    radial-gradient(ellipse 70% 12% at 85% 26%, rgba(135,165,185,0.55) 0%, transparent 65%),
    radial-gradient(ellipse 90% 22% at 10% 92%, #7a9a7a 0%, transparent 58%),
    radial-gradient(ellipse 85% 20% at 30% 88%, #8a9e7a 0%, transparent 55%),
    radial-gradient(ellipse 95% 24% at 50% 90%, #7d9570 0%, transparent 56%),
    radial-gradient(ellipse 80% 18% at 70% 87%, #859a78 0%, transparent 54%),
    radial-gradient(ellipse 100% 20% at 90% 91%, #789068 0%, transparent 58%),
    radial-gradient(ellipse 40% 16% at 12% 95%, #5a7a50 0%, transparent 52%),
    radial-gradient(ellipse 35% 14% at 38% 94%, #6a8a58 0%, transparent 50%),
    radial-gradient(ellipse 45% 15% at 58% 96%, #5d7d4d 0%, transparent 53%),
    radial-gradient(ellipse 30% 12% at 78% 93%, #688058 0%, transparent 48%),
    radial-gradient(ellipse 160% 10% at 50% 58%, rgba(255,255,255,0.5) 0%, transparent 65%),
    radial-gradient(ellipse 120% 8% at 35% 52%, rgba(255,255,255,0.35) 0%, transparent 60%),
    radial-gradient(ellipse 100% 6% at 65% 54%, rgba(255,255,255,0.35) 0%, transparent 58%),
    radial-gradient(ellipse 200% 20% at 50% 78%, rgba(240,230,200,0.6) 0%, transparent 55%),
    linear-gradient(to bottom,
      #d8e8f0 0%, #d5e2e8 15%, #e0e0d0 28%, #e8e0d0 40%,
      #e8dcc8 55%, #e0d5c0 70%, #d8ccb0 85%, #c8bc98 100%);
  background-attachment: fixed;
}

body::before {
  content: ''; position: fixed; inset: 8px;
  border: 1px solid rgba(139,115,85,0.12); border-radius: 2px;
  pointer-events: none; z-index: 0;
  box-shadow: inset 0 0 120px rgba(139,115,85,0.03);
}
body::after {
  content: ''; position: fixed; left: 0; top: 0; bottom: 0; width: 140px;
  background:
    repeating-linear-gradient(90deg, transparent, transparent 12px, rgba(80,100,70,0.05) 12px, rgba(80,100,70,0.05) 13px),
    linear-gradient(to right, rgba(100,120,80,0.1) 0%, transparent 60%);
  pointer-events: none; z-index: 0;
  transform-origin: bottom center;
  animation: bambooSway 7s ease-in-out infinite;
}

.container {
  width: 100%; max-width: 680px;
  display: flex; flex-direction: column; gap: 14px;
  position: relative; z-index: 1;
}

/* ===== 宋式意境动画 ===== */

/* 云雾流动 */
@keyframes mistDrift1 { 0% { transform: translateX(-3%); } 100% { transform: translateX(3%); } }
@keyframes mistDrift2 { 0% { transform: translateX(2%); } 100% { transform: translateX(-4%); } }
@keyframes mistDrift3 { 0% { transform: translateX(-2%); } 100% { transform: translateX(5%); } }

.atmosphere { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.mist {
  position: absolute; width: 220%; height: 35%;
  background: radial-gradient(ellipse 50% 80% at center, rgba(255,255,255,0.14) 0%, transparent 70%);
  filter: blur(28px);
}
.mist-1 { top: 6%;  animation: mistDrift1 28s ease-in-out infinite alternate; }
.mist-2 { top: 16%; animation: mistDrift2 35s ease-in-out infinite alternate; height: 28%; }
.mist-3 { top: 28%; animation: mistDrift3 42s ease-in-out infinite alternate; height: 22%; }

/* 水面微澜 */
@keyframes waterShimmer { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
.water-surface {
  position: fixed; left: 0; right: 0; bottom: 0; height: 70px; z-index: 0; pointer-events: none;
  background:
    repeating-linear-gradient(0deg, rgba(180,200,215,0.12) 0px, rgba(180,200,215,0.12) 1px, transparent 1px, transparent 4px),
    radial-gradient(ellipse 140% 100% at 25% 100%, rgba(195,215,225,0.18) 0%, transparent 60%),
    radial-gradient(ellipse 110% 80% at 70% 100%, rgba(195,215,225,0.13) 0%, transparent 55%);
  animation: waterShimmer 12s linear infinite;
}

/* 香烟袅袅 */
@keyframes incense1 { 0% { transform: translateY(0) scaleX(1); opacity: 0.45; } 50% { opacity: 0.6; } 100% { transform: translateY(-30px) scaleX(0.15); opacity: 0; } }
@keyframes incense2 { 0% { transform: translateY(0) scaleX(1.1); opacity: 0.35; } 60% { opacity: 0.45; } 100% { transform: translateY(-25px) scaleX(0.1); opacity: 0; } }
.incense { position: fixed; top: 18px; right: 12%; width: 3px; height: 0; z-index: 0; pointer-events: none; }
.incense::before, .incense::after {
  content: ''; position: absolute; left: 0; bottom: 0; width: 100%; border-radius: 50%;
  background: rgba(160,150,130,0.35); filter: blur(3px);
}
.incense::before { height: 18px; animation: incense1 4s ease-out infinite; }
.incense::after  { height: 14px; animation: incense2 3.5s ease-out 1.5s infinite; }

/* 光影斑驳 */
@keyframes dappledShift { 0% { background-position: 0% 0%, 100% 100%, 50% 60%; } 100% { background-position: 4% 2%, 96% 98%, 52% 58%; } }
.dappled-light {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 160px 100px at 22% 28%, rgba(255,255,220,0.05) 0%, transparent 100%),
    radial-gradient(ellipse 120px 80px at 68% 42%, rgba(255,255,220,0.04) 0%, transparent 100%),
    radial-gradient(ellipse 180px 120px at 48% 18%, rgba(255,255,240,0.04) 0%, transparent 100%);
  animation: dappledShift 20s ease-in-out infinite alternate;
}

/* 竹影婆娑 */
@keyframes bambooSway { 0%, 100% { transform: rotate(-0.25deg); } 50% { transform: rotate(0.25deg); } }

/* 标题气韵 */
@keyframes titleBreath { 0%, 100% { text-shadow: 0 1px 2px rgba(0,0,0,0.06); } 50% { text-shadow: 0 1px 10px rgba(139,115,85,0.12); } }

/* 细雨 */
@keyframes rainFall { 0% { transform: translateY(-50px); opacity: 0; } 4% { opacity: 0.2; } 96% { opacity: 0.1; } 100% { transform: translateY(100vh); opacity: 0; } }
.rain-layer { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; display: none; }
.rain-layer.active { display: block; }

/* ===== 标题 ===== */
.header { text-align: center; padding-top: 8px; }
.header h1 {
  font-size: 34px; font-weight: 700; letter-spacing: 8px; color: var(--ink);
  text-shadow: 0 1px 2px rgba(0,0,0,0.06);
  animation: titleBreath 6s ease-in-out infinite;
}
.header h1::before, .header h1::after {
  content: '◇'; font-size: 10px; color: var(--gold);
  vertical-align: middle; margin: 0 12px; opacity: 0.6;
}
.header .sub { font-size: 13px; color: var(--ink-mid); letter-spacing: 4px; margin-top: 4px; }

/* ===== 场景标签 ===== */
.scene-tabs {
  display: flex; gap: 6px; overflow-x: auto; padding: 4px 0;
  scrollbar-width: none; -ms-overflow-style: none;
}
.scene-tabs::-webkit-scrollbar { display: none; }
.scene-tab {
  flex-shrink: 0; padding: 7px 14px; border-radius: 20px;
  border: 1.5px solid #c8b898; background: rgba(245,239,224,0.7);
  backdrop-filter: blur(4px); cursor: pointer; font-size: 13px;
  letter-spacing: 1px; transition: all 0.25s; white-space: nowrap;
  font-family: inherit; color: var(--ink-mid);
}
.scene-tab:hover { border-color: var(--gold); color: var(--ink); background: rgba(255,255,255,0.85); transform: translateY(-1px); box-shadow: 0 2px 14px rgba(139,115,85,0.12); }
.scene-tab.active {
  background: var(--ink); color: #f5efe0; border-color: var(--ink);
  box-shadow: 0 2px 8px rgba(61,50,38,0.2);
}

.scene-theme {
  text-align: center; font-size: 13px; color: var(--ink-mid);
  letter-spacing: 4px; font-style: italic;
}

/* ===== 状态栏 ===== */
.stats { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.stat {
  background: rgba(245,239,224,0.8); backdrop-filter: blur(4px);
  border: 1px solid rgba(200,184,152,0.3); border-radius: var(--radius);
  padding: 5px 18px; text-align: center; box-shadow: var(--shadow-sm);
}
.stat .label { font-size: 11px; color: var(--ink-mid); letter-spacing: 1px; }
.stat .value { font-size: 20px; font-weight: 700; color: var(--ink); }

/* ===== 棋盘 ===== */
.board-wrap {
  position: relative;
  background: linear-gradient(135deg, #7a5c44 0%, #6b4f3c 30%, #7a5c44 60%, #5c3f2e 100%);
  border-radius: 10px; padding: 10px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,0.05);
  display: flex; justify-content: center; border: 2px solid #5c3f2e;
}
.board-wrap::before {
  content: ''; position: absolute; inset: 0; border-radius: 8px;
  background:
    repeating-linear-gradient(2deg, transparent, transparent 3px, rgba(255,255,255,0.015) 3px, rgba(255,255,255,0.015) 4px),
    repeating-linear-gradient(92deg, transparent, transparent 8px, rgba(0,0,0,0.02) 8px, rgba(0,0,0,0.02) 9px);
  pointer-events: none;
}
.board { display: grid; gap: 5px; position: relative; z-index: 1; }

.cell {
  background: rgba(200,184,152,0.35); border-radius: 4px;
  display: flex; justify-content: center; align-items: center;
  position: relative; cursor: default; aspect-ratio: 1; transition: background 0.3s;
}
.cell.locked {
  background: rgba(139,115,85,0.3); border: 1px dashed rgba(139,115,85,0.2);
}
.cell.locked::after { content: '🔒'; font-size: 14px; opacity: 0.25; }

/* ===== 物品瓦片 ===== */
.tile {
  width: 100%; height: 100%; border-radius: 4px;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  cursor: pointer; transition: transform 0.12s, box-shadow 0.12s;
  position: relative; overflow: hidden; padding: 2px;
}
.tile:hover { transform: scale(1.05); box-shadow: 0 3px 18px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.05); z-index: 5; filter: brightness(1.06); }
.tile:active { transform: scale(0.94); transition: transform 0.08s; }
.tile.selected {
  animation: tilePulse 0.8s ease-in-out infinite;
  box-shadow: 0 0 0 3px var(--gold), 0 0 16px rgba(184,134,11,0.4); z-index: 10;
}
@keyframes tilePulse {
  0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.12); }
}
.tile .tile-icon { width: 52%; height: 52%; display: flex; align-items: center; justify-content: center; }
.tile .tile-icon svg { width: 100%; height: 100%; display: block; }
.tile .tile-name { font-size: 0.68em; font-weight: 700; letter-spacing: 0.5px; line-height: 1.2; text-align: center; }
.tile .tile-lv { position: absolute; top: 2px; right: 4px; font-size: 7px; opacity: 0.45; letter-spacing: 0.5px; }

.tile[data-level="3"] { box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25); }
.tile[data-level="4"] { box-shadow: inset 0 0 0 1.5px rgba(255,255,255,0.3); }
.tile[data-level="5"] { box-shadow: inset 0 0 0 2px rgba(255,215,0,0.25); }
.tile[data-level="6"] { box-shadow: inset 0 0 0 2px rgba(255,215,0,0.35), 0 0 6px rgba(184,134,11,0.2); }
.tile[data-level="7"] {
  box-shadow: inset 0 0 0 2px rgba(255,215,0,0.45), 0 0 12px rgba(184,134,11,0.3);
  animation: legendaryGlow 2s ease-in-out infinite;
}
@keyframes legendaryGlow {
  0%, 100% { box-shadow: inset 0 0 0 2px rgba(255,215,0,0.45), 0 0 12px rgba(184,134,11,0.3); }
  50% { box-shadow: inset 0 0 0 2px rgba(255,215,0,0.6), 0 0 20px rgba(184,134,11,0.5); }
}

/* 链条色彩 */
.tile[data-chain="silk"]       { background: #fbeae8; color: #9b2d2a; }
.tile[data-chain="farm"]       { background: #fef6e8; color: #8b5e14; }
.tile[data-chain="med"]        { background: #e6f5ee; color: #0d6d4a; }
.tile[data-chain="ceramic"]    { background: #eaecf8; color: #3d4ea6; }
.tile[data-chain="tea"]        { background: #faf0e0; color: #7a4d14; }
.tile[data-chain="stationery"] { background: #eeedea; color: #3d3226; }

.tile[data-level="4"], .tile[data-level="5"],
.tile[data-level="6"], .tile[data-level="7"] {
  color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.2);
}
.tile[data-level="4"][data-chain="silk"]       { background: #c44a44; }
.tile[data-level="5"][data-chain="silk"]       { background: #b5343a; }
.tile[data-level="6"][data-chain="silk"]       { background: #a0252b; }
.tile[data-level="7"][data-chain="silk"]       { background: linear-gradient(135deg, #9b1b1b, #7a1010); }
.tile[data-level="4"][data-chain="farm"]       { background: #c8841a; }
.tile[data-level="5"][data-chain="farm"]       { background: #b07014; }
.tile[data-level="6"][data-chain="farm"]       { background: #9a5e0e; }
.tile[data-level="7"][data-chain="farm"]       { background: linear-gradient(135deg, #8b5000, #6b3a00); }
.tile[data-level="4"][data-chain="med"]        { background: #1a8d5a; }
.tile[data-level="5"][data-chain="med"]        { background: #147a4a; }
.tile[data-level="6"][data-chain="med"]        { background: #0e683a; }
.tile[data-level="7"][data-chain="med"]        { background: linear-gradient(135deg, #0a5530, #064020); }
.tile[data-level="4"][data-chain="ceramic"]    { background: #5a68c5; }
.tile[data-level="5"][data-chain="ceramic"]    { background: #4a5ab0; }
.tile[data-level="6"][data-chain="ceramic"]    { background: #3a4a9a; }
.tile[data-level="7"][data-chain="ceramic"]    { background: linear-gradient(135deg, #2e3d85, #1e2d6a); }
.tile[data-level="4"][data-chain="tea"]        { background: #9a6820; }
.tile[data-level="5"][data-chain="tea"]        { background: #8b5a18; }
.tile[data-level="6"][data-chain="tea"]        { background: #7a4a10; }
.tile[data-level="7"][data-chain="tea"]        { background: linear-gradient(135deg, #6b3a08, #502800); }
.tile[data-level="4"][data-chain="stationery"] { background: #5c5650; }
.tile[data-level="5"][data-chain="stationery"] { background: #4a4440; }
.tile[data-level="6"][data-chain="stationery"] { background: #3d3530; }
.tile[data-level="7"][data-chain="stationery"] { background: linear-gradient(135deg, #2a2420, #1a1410); }

.tile.popping { animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
@keyframes popIn { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.tile.merging { animation: inkBloom 0.5s ease-out; }
@keyframes inkBloom {
  0%   { transform: scale(0.3); opacity: 0; filter: blur(8px); }
  40%  { transform: scale(1.4); opacity: 0.7; filter: blur(2px); }
  70%  { transform: scale(0.95); opacity: 1; filter: blur(0); }
  100% { transform: scale(1); opacity: 1; filter: blur(0); }
}

/* ===== 订单面板（人物头像+故事版） ===== */
.orders-panel {
  display: flex; gap: 8px; justify-content: center;
}
.order-card {
  flex: 1; min-width: 0;
  background: rgba(255,252,245,0.9); backdrop-filter: blur(4px);
  border: 1.5px solid rgba(200,184,152,0.5);
  border-radius: 10px; box-shadow: var(--shadow-sm);
  display: flex; flex-direction: column;
  transition: all 0.25s; cursor: pointer;
  overflow: hidden; max-width: 220px;
}
.order-card:hover { border-color: var(--gold); box-shadow: var(--shadow); }
.order-card.selected-order {
  border-color: var(--red);
  background: rgba(254,245,245,0.95);
  box-shadow: 0 0 0 2px rgba(196,58,49,0.2);
}

/* 订单头部：头像+故事 */
.order-header {
  display: flex; align-items: center; gap: 8px; padding: 10px 10px 6px;
}
.order-avatar {
  flex-shrink: 0; width: 38px; height: 38px;
  border-radius: 50%; overflow: hidden;
  border: 2px solid rgba(184,134,11,0.3);
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
}
.order-avatar svg { width: 100%; height: 100%; display: block; }
.order-story {
  flex: 1; min-width: 0;
  font-size: 11px; color: var(--ink-light); line-height: 1.5; letter-spacing: 0.5px;
  font-style: italic;
}
.order-story strong { color: var(--ink); font-style: normal; }

/* 订单底部：物品+奖励+按钮 */
.order-footer {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 10px 10px;
  border-top: 1px dashed rgba(200,184,152,0.3);
}
.order-item {
  display: flex; align-items: center; gap: 4px; flex: 1; min-width: 0;
}
.order-item .order-icon { width: 20px; height: 20px; flex-shrink: 0; }
.order-item .order-icon svg { width: 100%; height: 100%; display: block; }
.order-item .order-name {
  font-size: 12px; font-weight: 700; letter-spacing: 1px; white-space: nowrap;
}
.order-reward {
  font-size: 11px; color: var(--gold); font-weight: 600; white-space: nowrap;
}
.order-btn {
  padding: 3px 14px; border-radius: 12px; border: none;
  font-size: 11px; cursor: pointer; font-family: inherit;
  letter-spacing: 1px; transition: all 0.2s; white-space: nowrap;
}
.order-btn.available { background: var(--red); color: #fff; }
.order-btn.available:hover { background: var(--red-dark); }
.order-btn.unavailable { background: #d5cfc6; color: #999; cursor: not-allowed; }

/* ===== 按钮 ===== */
.btn-row { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.btn {
  padding: 8px 22px; border-radius: 20px; border: none;
  font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
  letter-spacing: 1px; transition: all 0.2s;
}
.btn-primary { background: var(--ink); color: #f5efe0; position: relative; overflow: hidden; }
.btn-primary::after {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(circle at center, rgba(255,255,255,0.2) 0%, transparent 70%);
  opacity: 0; transition: opacity 0.3s;
}
.btn-primary:hover { opacity: 0.88; }
.btn-primary:hover::after { opacity: 1; }
.btn-primary:active { transform: scale(0.96); }
.btn-ghost {
  background: rgba(245,239,224,0.6); color: var(--ink-light);
  border: 1.5px solid #c8b898; backdrop-filter: blur(4px);
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.btn-ghost:hover { border-color: var(--ink); color: var(--ink); background: rgba(255,255,255,0.75); transform: translateY(-1px); box-shadow: 0 2px 10px rgba(139,115,85,0.12); }

.hint { text-align: center; font-size: 12px; color: #b0a090; letter-spacing: 1px; }

/* Toast */
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: #f5efe0; padding: 8px 24px;
  border-radius: 20px; font-size: 13px; letter-spacing: 1px;
  z-index: 100; opacity: 0; transition: opacity 0.3s;
  pointer-events: none; box-shadow: 0 4px 16px rgba(0,0,0,0.2);
}
.toast.show { opacity: 1; }

@media (max-width: 500px) {
  .header h1 { font-size: 24px; letter-spacing: 4px; }
  .scene-tab { padding: 5px 10px; font-size: 12px; }
  .orders-panel { flex-direction: column; align-items: center; }
  .order-card { max-width: 100%; width: 100%; }
}
</style>
</head>
<body>

<div class="atmosphere">
  <div class="mist mist-1"></div>
  <div class="mist mist-2"></div>
  <div class="mist mist-3"></div>
</div>
<div class="water-surface"></div>
<div class="incense"></div>
<div class="dappled-light"></div>
<div class="rain-layer" id="rainLayer"></div>

<div class="container">
  <div class="header">
    <h1>空格之境</h1>
    <div class="sub">— 宋代风物 · 合成棋盘 —</div>
  </div>

  <div class="scene-tabs" id="sceneTabs"></div>
  <div class="scene-theme" id="sceneTheme"></div>

  <div class="stats">
    <div class="stat"><div class="label">铜钱</div><div class="value" id="coins">0</div></div>

// ============================================================
//  大棋盘解锁
// ============================================================

const UNLOCK_ORDER = (() => {
  const size = 7, center = 3;
  const cells = [];
  for (let r = 0; r < size; r++)
    for (let c = 0; c < size; c++)
      cells.push({ r, c, dist: Math.abs(r - center) + Math.abs(c - center) });
  cells.sort((a, b) => a.dist - b.dist || a.r - b.r || a.c - b.c);
  return cells.map(({ r, c }) => ({ r, c }));
})();

function isCellLocked(r, c) {
  const scene = gameState.scenes['courtyard'];
  const idx = UNLOCK_ORDER.findIndex(p => p.r === r && p.c === c);
  return idx >= scene.unlockedCells;
}

// ============================================================
//  游戏状态
// ============================================================

const gameState = {
  currentScene: 'courtyard', selectedCell: null, selectedOrder: null,
  scenes: {}, toastTimer: null, newDrops: new Set(),
};

function newSceneState(scene) {
  const size = scene.size;
  const board = Array.from({ length: size }, () => Array.from({ length: size }, () => null));
  const base = { board, orders: [], score: 0, coins: 0,
    highestCreated: 0, dropTimer: null, size, chains: scene.chains };
  if (scene.id === 'courtyard') base.unlockedCells = 14;
  return base;
}

function getScene() { return gameState.scenes[gameState.currentScene]; }
function getSceneDef() { return SCENES.find(s => s.id === gameState.currentScene); }

// ============================================================
//  初始化
// ============================================================

function initAllScenes() {
  SCENES.forEach(s => { if (!gameState.scenes[s.id]) gameState.scenes[s.id] = newSceneState(s); });
}

function enterScene(sceneId) {
  const cur = getScene();
  if (cur && cur.dropTimer) { clearInterval(cur.dropTimer); cur.dropTimer = null; }
  gameState.currentScene = sceneId;
  gameState.selectedCell = null; gameState.selectedOrder = null;
  gameState.newDrops = new Set();
  const scene = getScene(), sceneDef = getSceneDef();
  if (!scene._initialized) { scene._initialized = true; initializeBoard(scene, sceneDef); }
  startDropTimer(scene, sceneDef);
  renderAll();
}

function initializeBoard(scene, sceneDef) {
  for (let i = 0; i < 8 + Math.floor(Math.random() * 3); i++) dropItem(scene, sceneDef);
  refreshOrders(scene, sceneDef);
}

function startDropTimer(scene, sceneDef) {
  if (scene.dropTimer) clearInterval(scene.dropTimer);
  scene.dropTimer = setInterval(() => { dropItem(scene, sceneDef); renderBoard(); }, 6000 + Math.random() * 4000);
}

// ============================================================
//  物品投放
// ============================================================

function getDropPool(sceneDef) {
  if (sceneDef.chains === 'all') return CHAINS.map(c => ({ chain: c.id, level: 0 }));
  return sceneDef.chains.map(cid => ({ chain: cid, level: 0 }));
}

function getEmptyCells(board, sceneDef) {
  const empties = [];
  for (let r = 0; r < sceneDef.size; r++)
    for (let c = 0; c < sceneDef.size; c++) {
      if (board[r][c] !== null) continue;
      if (sceneDef.id === 'courtyard' && isCellLocked(r, c)) continue;
      empties.push([r, c]);
    }
  return empties;
}

function dropItem(scene, sceneDef) {
  const empties = getEmptyCells(scene.board, sceneDef);
  if (empties.length === 0) return null;
  const pool = getDropPool(sceneDef);
  const pick = pool[Math.floor(Math.random() * pool.length)];
  const level = Math.random() < 0.1 ? 1 : 0;
  const [r, c] = empties[Math.floor(Math.random() * empties.length)];
  scene.board[r][c] = { chain: pick.chain, level };
  gameState.newDrops.add(`${r},${c}`);
  return { row: r, col: c };
}

function manualDrop() {
  const result = dropItem(getScene(), getSceneDef());
  if (result) renderBoard(); else showToast('没有空位了');
}

// ============================================================

function selectCell(row, col) {
  const scene = getScene(), board = scene.board, item = board[row][col];
  if (!item) {
    if (gameState.selectedOrder !== null) { gameState.selectedOrder = null; renderOrders(); return; }
    clearSelection(); renderBoard(); return;
  }
  if (gameState.selectedOrder !== null) { tryFulfillOrder(row, col); return; }
  if (gameState.selectedCell) {
    const sr = gameState.selectedCell.row, sc = gameState.selectedCell.col;
    const sel = board[sr] && board[sr][sc];
    if (sr === row && sc === col) { clearSelection(); renderBoard(); return; }
    if (sel && sel.chain === item.chain && sel.level === item.level && item.level < 7) {
      executeMerge(sr, sc, row, col);
    } else { gameState.selectedCell = { row, col }; renderBoard(); }
  } else { gameState.selectedCell = { row, col }; renderBoard(); }
}

function executeMerge(fromRow, fromCol, toRow, toCol) {
  const scene = getScene(), sceneDef = getSceneDef(), board = scene.board;
  const newLevel = board[fromRow][fromCol].level + 1;
  board[fromRow][fromCol] = null;
  board[toRow][toCol] = { chain: board[toRow][toCol].chain, level: newLevel };
  scene.score += (newLevel + 1) * 10;
  if (newLevel > scene.highestCreated) {
    scene.highestCreated = newLevel;
    if (sceneDef.id === 'courtyard') updateUnlockedCells();
  }
  gameState.selectedCell = null; gameState.selectedOrder = null;
  refreshOrders(scene, sceneDef);
  if (Math.random() < 0.3) dropItem(scene, sceneDef);
  renderAll();
  const sceneId = gameState.currentScene;
  requestAnimationFrame(() => {
    const el = document.querySelector(`.tile[data-scene="${sceneId}"][data-r="${toRow}"][data-c="${toCol}"]`);
    if (el) { el.classList.add('merging'); setTimeout(() => el.classList.remove('merging'), 300); }
  });
}

function clearSelection() { gameState.selectedCell = null; gameState.selectedOrder = null; }
function updateUnlockedCells() {
  gameState.scenes['courtyard'].unlockedCells = Math.min(49, 14 + gameState.scenes['courtyard'].highestCreated * 5);
}

// ============================================================
//  订单系统（人物+故事版）
// ============================================================

function generateOrder(sceneDef) {
  const pool = sceneDef.chains === 'all' ? CHAINS.map(c => c.id) : sceneDef.chains;
  const chainId = pool[Math.floor(Math.random() * pool.length)];
  let level;
  const r = Math.random();
  if (r < 0.8)      level = Math.random() < 0.5 ? 0 : 1;
  else if (r < 0.95) level = 2 + Math.floor(Math.random() * 2);
  else               level = 4 + Math.floor(Math.random() * 3);

  const chainDef = CHAIN_MAP[chainId];
  const char = CHARACTERS[Math.floor(Math.random() * CHARACTERS.length)];
  const storyTmpl = char.stories[Math.floor(Math.random() * char.stories.length)];
  const story = storyTmpl
    .replace('{name}', char.name)
    .replace('{chain}', chainDef.name)
    .replace('{item}', chainDef.items[level]);

  return { chain: chainId, level, reward: ORDER_REWARDS[level], character: char, story };
}

function refreshOrders(scene, sceneDef) {
  while (scene.orders.length < 3) scene.orders.push(generateOrder(sceneDef));
}

function selectOrder(index) {
  const scene = getScene(), order = scene.orders[index];
  if (!order) return;
  if (!hasMatchingItem(scene, order)) { showToast('棋盘上没有符合条件的物品'); return; }
  gameState.selectedOrder = (gameState.selectedOrder === index) ? null : index;
  gameState.selectedCell = null;
  renderAll();
}

function hasMatchingItem(scene, order) {
  const b = scene.board;
  for (let r = 0; r < scene.size; r++)
    for (let c = 0; c < scene.size; c++) {
      const it = b[r][c];
      if (it && it.chain === order.chain && it.level === order.level) return true;
    }
  return false;
}

function tryFulfillOrder(row, col) {
  const scene = getScene(), board = scene.board;
  const orderIdx = gameState.selectedOrder, order = scene.orders[orderIdx];
  const item = board[row][col];
  if (!item || item.chain !== order.chain || item.level !== order.level) {
    showToast('物品与订单不符'); gameState.selectedOrder = null; renderAll(); return;
  }
  board[row][col] = null;
  scene.coins += order.reward; scene.score += order.reward;
  const sceneDef = getSceneDef();
  scene.orders.splice(orderIdx, 1);
  scene.orders.push(generateOrder(sceneDef));
  gameState.selectedOrder = null;
  showToast(`${order.character.name}满意地走了！+${order.reward} 铜钱`);
  renderAll();
}

// ============================================================
//  渲染
// ============================================================

function renderAll() { renderSceneTabs(); renderSceneTheme(); renderBoard(); renderStats(); renderOrders(); }

function renderSceneTabs() {
  const container = document.getElementById('sceneTabs');
  container.innerHTML = SCENES.map(s => {
    const active = s.id === gameState.currentScene ? ' active' : '';
    let iconHtml = s.icon;
    if (s.id !== 'courtyard' && s.chainId && CHAIN_SVG[s.chainId]) {
      iconHtml = `<span style="display:inline-block;width:16px;height:16px;vertical-align:middle;color:inherit">${CHAIN_SVG[s.chainId]}</span>`;
    }
    return `<button class="scene-tab${active}" data-scene="${s.id}">${iconHtml} ${s.name}</button>`;
  }).join('');
  container.querySelectorAll('.scene-tab').forEach(btn => {
    btn.addEventListener('click', () => enterScene(btn.dataset.scene));
  });
}

function renderSceneTheme() { document.getElementById('sceneTheme').textContent = getSceneDef().theme; }

function renderBoard() {
  const container = document.getElementById('board');
  const scene = getScene(), sceneDef = getSceneDef(), board = scene.board, size = sceneDef.size;
  const padding = 20, gaps = (size - 1) * 5;
  const maxW = Math.min(500, window.innerWidth - 40);
  const cellSize = Math.floor((maxW - padding - gaps) / size);
  container.style.gridTemplateColumns = `repeat(${size}, ${cellSize}px)`;
  container.style.gridTemplateRows = `repeat(${size}, ${cellSize}px)`;
  container.style.width = `${size * cellSize + gaps + padding}px`;
  container.innerHTML = '';
  const selected = gameState.selectedCell, sceneId = gameState.currentScene;

  for (let r = 0; r < size; r++) {
    for (let c = 0; c < size; c++) {
      const cell = document.createElement('div'); cell.className = 'cell';
      if (sceneDef.id === 'courtyard' && isCellLocked(r, c)) { cell.classList.add('locked'); }
      else { cell.classList.add('unlocked-empty'); }
      const item = board[r][c];
      if (item) {
        const chainDef = CHAIN_MAP[item.chain];
        const isSel = selected && selected.row === r && selected.col === c;
        const key = `${r},${c}`, isNew = gameState.newDrops.has(key);
        if (isNew) gameState.newDrops.delete(key);
        cell.innerHTML = `<div class="tile${isSel ? ' selected' : ''}${isNew ? ' popping' : ''}"
          data-chain="${item.chain}" data-level="${item.level}" data-r="${r}" data-c="${c}" data-scene="${sceneId}">
          <span class="tile-icon">${CHAIN_SVG[item.chain] || ''}</span>
          <span class="tile-name">${chainDef.items[item.level]}</span>
          <span class="tile-lv">Lv${item.level}</span></div>`;
      }
      cell.addEventListener('click', () => { if (!cell.classList.contains('locked')) selectCell(r, c); });
      container.appendChild(cell);
    }
  }
}

function renderStats() {
  const scene = getScene(), sceneDef = getSceneDef();
  document.getElementById('coins').textContent = scene.coins;
  document.getElementById('score').textContent = scene.score;
  const unlockStat = document.getElementById('unlockStat'), unlockInfo = document.getElementById('unlockInfo');
  if (sceneDef.id === 'courtyard') { unlockStat.style.display = ''; unlockInfo.textContent = `${scene.unlockedCells}/49`; }
  else { unlockStat.style.display = 'none'; }
}

function renderOrders() {
  const scene = getScene(), container = document.getElementById('ordersPanel'), selectedOrder = gameState.selectedOrder;
  container.innerHTML = scene.orders.map((order, i) => {
    const chainDef = CHAIN_MAP[order.chain], itemName = chainDef.items[order.level];
    const available = hasMatchingItem(scene, order), selected = selectedOrder === i;
    return `<div class="order-card${selected ? ' selected-order' : ''}">
      <div class="order-header">
        <div class="order-avatar">${order.character.avatar}</div>
        <div class="order-story">${order.story}</div>
      </div>
      <div class="order-footer">
        <div class="order-item">
          <span class="order-icon">${CHAIN_SVG[order.chain] || ''}</span>
          <span class="order-name">${itemName}</span>
        </div>
        <span class="order-reward">💰 ${order.reward}</span>
        <button class="order-btn ${available ? 'available' : 'unavailable'}" data-order-idx="${i}">${available ? '交付' : '缺少'}</button>
      </div></div>`;
  }).join('');

  container.querySelectorAll('.order-card').forEach(card => {
    card.addEventListener('click', (e) => {
      if (e.target.classList.contains('order-btn')) return;
      selectOrder(parseInt(card.querySelector('.order-btn').dataset.orderIdx));
    });
  });
  container.querySelectorAll('.order-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const idx = parseInt(btn.dataset.orderIdx);
      if (!btn.classList.contains('unavailable')) selectOrder(idx);
      else showToast('棋盘上没有符合条件的物品');
    });
  });
}

// ============================================================
//  Toast
// ============================================================

function showToast(msg) {
  const el = document.getElementById('toast');
  if (gameState.toastTimer) clearTimeout(gameState.toastTimer);
  el.textContent = msg; el.classList.add('show');
  gameState.toastTimer = setTimeout(() => { el.classList.remove('show'); gameState.toastTimer = null; }, 1800);
}

// ============================================================
//  重置 & 启动
// ============================================================

function resetCurrentScene() {
  const scene = getScene(), sceneDef = getSceneDef();
  if (scene.dropTimer) clearInterval(scene.dropTimer);
  scene.board = Array.from({ length: sceneDef.size }, () => Array.from({ length: sceneDef.size }, () => null));
  scene.orders = []; scene.score = 0; scene.coins = 0; scene.highestCreated = 0;
  if (sceneDef.id === 'courtyard') scene.unlockedCells = 14;
  gameState.selectedCell = null; gameState.selectedOrder = null;
  gameState.newDrops = new Set();
  initializeBoard(scene, sceneDef); startDropTimer(scene, sceneDef); renderAll();
}

function bootstrap() { initAllScenes(); enterScene('courtyard'); }
document.addEventListener('DOMContentLoaded', bootstrap);
</script>
</body>
