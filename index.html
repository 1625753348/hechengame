<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>空格之境 - 合成棋盘</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background: #faf8ef;
  font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  user-select: none;
}
.container {
  text-align: center;
  padding: 20px;
}
.header {
  margin-bottom: 24px;
}
.header h1 {
  font-size: 42px;
  font-weight: 700;
  color: #776e65;
  letter-spacing: 6px;
}
.header .sub {
  font-size: 14px;
  color: #999;
  margin-top: 6px;
  letter-spacing: 2px;
}
.score-bar {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-bottom: 20px;
}
.score-box {
  background: #bbada0;
  color: #fff;
  border-radius: 6px;
  padding: 6px 20px;
  min-width: 80px;
}
.score-box .label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  opacity: 0.7;
}
.score-box .value {
  font-size: 22px;
  font-weight: 700;
}
.board-wrapper {
  position: relative;
  background: #bbada0;
  border-radius: 10px;
  padding: 10px;
  display: inline-block;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
}
.board {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  width: 400px;
  height: 400px;
}
.cell {
  background: rgba(238, 228, 218, 0.35);
  border-radius: 6px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 32px;
  font-weight: 700;
  color: #776e65;
  transition: all 0.15s ease;
  position: relative;
}
.tile {
  position: absolute;
  width: 85px;
  height: 85px;
  border-radius: 6px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 32px;
  font-weight: 700;
  transition: all 0.12s ease;
  z-index: 10;
}
.tile-2 { background: #eee4da; color: #776e65; }
.tile-4 { background: #ede0c8; color: #776e65; }
.tile-8 { background: #f2b179; color: #f9f6f2; }
.tile-16 { background: #f59563; color: #f9f6f2; }
.tile-32 { background: #f67c5f; color: #f9f6f2; }
.tile-64 { background: #f65e3b; color: #f9f6f2; }
.tile-128 { background: #edcf72; color: #f9f6f2; font-size: 28px; }
.tile-256 { background: #edcc61; color: #f9f6f2; font-size: 28px; }
.tile-512 { background: #edc850; color: #f9f6f2; font-size: 28px; }
.tile-1024 { background: #edc53f; color: #f9f6f2; font-size: 22px; }
.tile-2048 { background: #edc22e; color: #f9f6f2; font-size: 22px; }
.tile-new { animation: pop 0.2s ease; }
.tile-merge { animation: merge 0.2s ease; }
@keyframes pop {
  0% { transform: scale(0); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes merge {
  0% { transform: scale(1.2); }
  50% { transform: scale(1.25); }
  100% { transform: scale(1); }
}
.btn-row {
  margin-top: 20px;
  display: flex;
  justify-content: center;
  gap: 12px;
}
.btn {
  padding: 10px 28px;
  border: none;
  border-radius: 6px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-primary {
  background: #8f7a66;
  color: #f9f6f2;
}
.btn-primary:hover {
  background: #7a6658;
}
.btn-secondary {
  background: #eee4da;
  color: #776e65;
}
.btn-secondary:hover {
  background: #e0d4c8;
}
.hint {
  font-size: 13px;
  color: #999;
  margin-top: 12px;
  letter-spacing: 1px;
}
.game-over-overlay {
  position: absolute;
  inset: 0;
  background: rgba(250, 248, 239, 0.7);
  border-radius: 10px;
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 100;
}
.game-over-overlay.show {
  display: flex;
}
.game-over-content {
  text-align: center;
}
.game-over-content h2 {
  font-size: 36px;
  color: #776e65;
  margin-bottom: 12px;
}
.game-over-content .btn {
  margin-top: 8px;
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>空格之境</h1>
    <div class="sub">合成棋盘</div>
  </div>

  <div class="score-bar">
    <div class="score-box">
      <div class="label">分数</div>
      <div class="value" id="score">0</div>
    </div>
    <div class="score-box">
      <div class="label">步数</div>
      <div class="value" id="moves">0</div>
    </div>
  </div>

  <div class="board-wrapper">
    <div class="board" id="board"></div>
    <div class="game-over-overlay" id="gameOverOverlay">
      <div class="game-over-content">
        <h2>游戏结束</h2>
        <button class="btn btn-primary" onclick="restartGame()">再来一局</button>
      </div>
    </div>
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" onclick="restartGame()">新游戏</button>
    <button class="btn btn-secondary" onclick="undoMove()">撤销</button>
  </div>
  <div class="hint">← ↑ → ↓ 方向键移动 · 相同数字合并</div>
</div>

<script>
const SIZE = 4;
let board = [];
let score = 0;
let moves = 0;
let gameOver = false;
let prevState = null;

function initBoard() {
  board = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
  score = 0;
  moves = 0;
  gameOver = false;
  prevState = null;
  document.getElementById('gameOverOverlay').classList.remove('show');
  addRandomTile();
  addRandomTile();
  render();
}

function addRandomTile() {
  const empty = [];
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (board[r][c] === 0) empty.push([r, c]);
    }
  }
  if (empty.length === 0) return;
  const [r, c] = empty[Math.floor(Math.random() * empty.length)];
  board[r][c] = Math.random() < 0.9 ? 2 : 4;
}

function saveState() {
  prevState = {
    board: board.map(row => [...row]),
    score,
    moves,
  };
}

function undoMove() {
  if (!prevState) return;
  board = prevState.board.map(row => [...row]);
  score = prevState.score;
  moves = prevState.moves;
  prevState = null;
  gameOver = false;
  document.getElementById('gameOverOverlay').classList.remove('show');
  render();
}

function slideRow(row) {
  let arr = row.filter(v => v !== 0);
  let merged = [];
  let i = 0;
  while (i < arr.length) {
    if (i + 1 < arr.length && arr[i] === arr[i + 1]) {
      merged.push(arr[i] * 2);
      score += arr[i] * 2;
      i += 2;
    } else {
      merged.push(arr[i]);
      i++;
    }
  }
  while (merged.length < SIZE) merged.push(0);
  return merged;
}

function move(direction) {
  if (gameOver) return;
  saveState();

  let rotated = false;
  let newBoard;

  if (direction === 'up' || direction === 'down') {
    board = rotate(board);
    rotated = true;
  }
  if (direction === 'right' || direction === 'down') {
    board = board.map(row => [...row].reverse());
  }

  newBoard = board.map(row => slideRow(row));

  if (direction === 'right' || direction === 'down') {
    newBoard = newBoard.map(row => [...row].reverse());
  }
  if (rotated) {
    newBoard = rotate(newBoard);
    newBoard = rotate(newBoard);
    newBoard = rotate(newBoard);
  }

  if (JSON.stringify(newBoard) === JSON.stringify(board)) {
    prevState = null;
    return;
  }

  board = newBoard;
  moves++;
  addRandomTile();
  render();

  if (checkGameOver()) {
    gameOver = true;
    document.getElementById('gameOverOverlay').classList.add('show');
  }
}

function rotate(matrix) {
  const n = matrix.length;
  const result = Array.from({ length: n }, () => Array(n).fill(0));
  for (let r = 0; r < n; r++) {
    for (let c = 0; c < n; c++) {
      result[c][n - 1 - r] = matrix[r][c];
    }
  }
  return result;
}

function checkGameOver() {
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (board[r][c] === 0) return false;
      if (c + 1 < SIZE && board[r][c] === board[r][c + 1]) return false;
      if (r + 1 < SIZE && board[r][c] === board[r + 1][c]) return false;
    }
  }
  return true;
}

function render() {
  const boardEl = document.getElementById('board');

  boardEl.innerHTML = '';

  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      boardEl.appendChild(cell);
    }
  }

  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const val = board[r][c];
      if (val === 0) continue;
      const tile = document.createElement('div');
      tile.className = `tile tile-${val}`;
      tile.textContent = val;
      tile.style.left = `${c * 85 + c * 10 + 10}px`;
      tile.style.top = `${r * 85 + r * 10 + 10}px`;
      boardEl.appendChild(tile);
    }
  }

  document.getElementById('score').textContent = score;
  document.getElementById('moves').textContent = moves;
}

function restartGame() {
  initBoard();
}

document.addEventListener('keydown', (e) => {
  const map = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right',
  };
  const dir = map[e.key];
  if (dir) {
    e.preventDefault();
    move(dir);
  }
});

let touchStartX = 0, touchStartY = 0;
document.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });
document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
document.addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  const absX = Math.abs(dx);
  const absY = Math.abs(dy);
  if (Math.max(absX, absY) < 20) return;
  if (absX > absY) {
    move(dx > 0 ? 'right' : 'left');
  } else {
    move(dy > 0 ? 'down' : 'up');
  }
}, { passive: true });

initBoard();
</script>
</body>
</html>
